t:"يمنع التنصت وقراءة المحتوى أثناء النقل"},{color:"orange",title:"الحقيقة",text:"لا تعتمد على تقنية واحدة بل عدة تقنيات معاً"}]},{id:5,lesson:1,lessonLabel:"الدرس 2-1",type:"content",title:"كيف تعمل HTTPS؟ - نظرة عامة",points:["HTTP + TLS: بروتوكولان يعملان معاً - HTTP ينقل المحتوى، TLS يحميه","المرحلة 1: مصافحة الشهادة - الخادم يرسل شهادته الرقمية، المتصفح يتحقق من صحتها","المرحلة 2: مصافحة مفاتيح الجلسة - يتفقان على إعدادات التشفير ويشتقان مفاتيح جلسة متماثلة","المرحلة 3: تبادل البيانات - بعد الاتفاق، تُحمى جميع البيانات بالتشفير المتماثل السريع"],flow:["متصفح يطلب اتصال آمن","الخادم يرسل الشهادة + المفتاح العام","التحقق والاتفاق على مفاتيح الجلسة","تشفير متماثل سريع للبيانات"]},{id:6,lesson:1,lessonLabel:"الدرس 2-1",type:"content",title:"مراحل TLS بالتفصيل",boxes:[{color:"blue",title:"1. التحقق من الشهادة الرقمية",text:"المتصفح يتحقق أن الشهادة صادرة من جهة موثوقة، غير منتهية، وتطابق اسم النطاق"},{color:"purple",title:"2. اشتقاق مفاتيح الجلسة",text:"باستخدام المفتاح العام والخاص، يتفق الطرفان على أسرار مشتركة يشتقان منها مفاتيح متماثلة"},{color:"green",title:"3. التشفير المتماثل السريع",text:"بعد المصافحة، كل البيانات تُشفر بمفتاح جلسة واحد مشترك لأنه أسرع وأكفأ للبيانات الكبيرة"}],extraNote:"لماذا لا نستخدم المفتاح العام لكل شيء؟ لأنه بطيء جداً للبيانات الكثيرة!"},{id:7,lesson:1,lessonLabel:"الدرس 2-1",type:"diagram",title:"مخطط تدفق HTTPS - من المتصفح للخادم",flow:["\uD83C\uDF10 المتصفح: ClientHello - أريد اتصال آمن","\uD83D\uDDA5️ الخادم يرسل: الشهادة الرقمية + المفتاح العام","\uD83D\uDD0D المتصفح يتحقق: هل الشهادة موثوقة؟ هل الاسم مطابق؟","\uD83E\uDD1D اتفاق: باستخدام المفتاح العام، يتفقان على مفاتيح الجلسة","⚡ التشفير المتماثل: سريع - كل البيانات بعد ذلك مشفرة به","\uD83D\uDCE6 الخادم يستقبل: بيانات مشفرة بأمان، يفكها بالمفتاح المشترك","✅ النتيجة: العام للمصادقة والاتفاق، ثم المتماثل لحماية البيانات الفعلية"]},{id:8,lesson:1,lessonLabel:"الدرس 2-1",type:"content",title:"التشفير بالمفتاح العام - غير المتماثل",points:["نظام غير متماثل: زوج مفاتيح مترابط رياضياً - عام وخاص","المفتاح العام: للجميع - يُستخدم للتشفير والتحقق من التوقيع","المفتاح الخاص: لصاحبه فقط - يُستخدم لفك التشفير وإنشاء التوقيع","يُستخدم في TLS Handshake للمصادقة والاتفاق على مفاتيح الجلسة وليس لتشفير كل البيانات"],boxes:[{color:"blue",title:"المفتاح العام \uD83D\uDD13",text:"انشره للجميع - يشفر الرسائل لك، ويتحقق من توقيعك"},{color:"orange",title:"المفتاح الخاص \uD83D\uDD10",text:"سري جداً - يفك ما شُفر بالعام، ويوقع باسمك"},{color:"green",title:"في TLS",text:"للمصادقة والاتفاق على أسرار الجلسة فقط"}]},{id:9,lesson:1,lessonLabel:"الدرس 2-1",type:"comparison",title:"التشفير المتماثل - مفتاح واحد مشترك",points:["مفتاح واحد مشترك: نفس المفتاح يشفر ويفك التشفير","الميزة الكبرى: سريع جداً وكفء للبيانات الكبيرة والبث المستمر","المشكلة: كيف نتفق على المفتاح بأمان؟ هنا يأتي دور المفتاح العام","المقارنة: العام للاتصال والمصادقة والاتفاق، المتماثل لحماية البيانات الفعلية بعد الاتفاق"],boxes:[{color:"green",title:"متماثل ⚡",text:"مفتاح واحد - سريع - للبيانات الكثيرة بعد المصافحة"},{color:"blue",title:"غير متماثل \uD83D\uDD11",text:"مفتاحان - أبطأ - للمصادقة والاتفاق الأولي"},{color:"yellow",title:"HTTPS يجمعهما",text:"يبدأ بغير المتماثل، ثم ينتقل للمتماثل"}]},{id:10,lesson:1,lessonLabel:"الدرس 2-1",type:"content",title:"المصادقة الثنائية 2FA",points:["التعريف: استخدام عاملين مستقلين من فئتين مختلفتين للتحقق من الهوية","الفئات الثلاث: شيء تعرفه (كلمة مرور)، شيء تملكه (هاتف/بطاقة)، شيء أنت هو (بصمة/وجه)","مثال: كلمة المرور (معرفة) + رمز OTP من الهاتف (حيازة)","الأهمية: إذا تسربت كلمة المرور، يظل احتمال الدخول غير المصرح منخفضاً لأن المهاجم يحتاج العامل الثاني"],boxes:[{color:"green",title:"تعريف 2FA",text:"عاملان مستقلان من فئتين مختلفتين إلزامي"},{color:"orange",title:"مثال",text:"كلمة مرور + رمز هاتف = معرفة + حيازة"},{color:"blue",title:"لماذا؟",text:"إذا تسربت كلمة المرور، الهاتف ما زال معك"}]},{id:11,lesson:1,lessonLabel:"الدرس 2-1",type:"content",title:"أمثلة واقعية لـ 2FA",boxes:[{color:"blue",title:"\uD83C\uDFE6 مصرفي",text:"معرفة (كلمة مرور) + حيازة (بطاقة + رمز هاتف)"},{color:"green",title:"\uD83D\uDCAC تواصل",text:"معرفة (كلمة مرور) + SMS (رمز لمرة واحدة)"},{color:"yellow",title:"\uD83C\uDFE2 مبنى",text:"حيازة (بطاقة دخول) + حيوي (بصمة إصبع)"},{color:"orange",title:"\uD83D\uDED2 تسوق",text:"معرفة (كلمة مرور) + حيازة (بطاقة بنكية + OTP)"}],extraNote:"كل مثال يستخدم فئتين مختلفتين - هذا شرط أساسي ليكون 2FA حقيقي"},{id:12,lesson:1,lessonLabel:"الدرس 2-1",type:"content",title:"التوقيع الرقمي - ليس تشفيراً!",points:["الوظيفة: يكتشف التلاعب بالرسالة ويكشف انتحال الهوية","يوفر دليلاً قوياً: عدم التنصل (Non-repudiation) - المرسل لا يستطيع إنكار إرساله","كيف يعمل؟ المرسل يوقع بالمفتاح الخاص، المستقبل يتحقق بالمفتاح العام","إذا تغير حرف واحد في الرسالة، يفشل التحقق - لذلك يكشف التلاعب"],boxes:[{color:"purple",title:"يكتشف",text:"التلاعب + انتحال الهوية"},{color:"green",title:"يوفر",text:"دليل عدم التنصل - إثبات قانوني"},{color:"blue",title:"آلية",text:"توقيع بالخاص، تحقق بالعام"}]},{id:13,lesson:1,lessonLabel:"الدرس 2-1",type:"content",title:"الشهادة الرقمية - بطاقة هوية الخادم",points:["تساعد المتصفح على التحقق من هوية الخادم - هل هذا فعلاً google.com؟","تحتوي على: اسم النطاق، المفتاح العام للخادم، الجهة المصدرة، تاريخ الصلاحية، توقيع الجهة","تصدرها جهات موثوقة (CA) مثل Let's Encrypt, DigiCert","المتصفح يثق بـ CA، و CA تثق بالخادم بعد التحقق - سلسلة ثقة"],boxes:[{color:"blue",title:"ما هي؟",text:"بطاقة هوية رقمية تربط النطاق بالمفتاح العام"},{color:"green",title:"من يصدرها؟",text:"جهة شهادات موثوقة CA بعد التحقق من الهوية"},{color:"orange",title:"لماذا مهمة؟",text:"تمنع هجمات انتحال المواقع المزيفة"}]},{id:14,lesson:1,lessonLabel:"الدرس 2-1",type:"content",title:"كيف تتركب تقنيات الأمان معاً؟ - طبقات",boxes:[{color:"blue",title:"\uD83D\uDD12 التشفير",text:"يمنع قراءة المحتوى - سرية البيانات"},{color:"purple",title:"✍️ التوقيع",text:"يدعم التحقق من سلامة الرسالة، هوية المرسل، دليل عدم التنصل"},{color:"green",title:"\uD83D\uDCDC الشهادة",text:"تتحقق من هوية الخادم وتربطه بالنطاق والمفتاح العام"},{color:"orange",title:"\uD83D\uDD10 2FA",text:"تقلل احتمالية الدخول غير المصرح حتى لو تسربت كلمة المرور"}],extraNote:"الحماية الحقيقية = تشفير + توقيع + شهادة + مصادقة قوية"},{id:15,lesson:1,lessonLabel:"الدرس 2-1",type:"scenario",title:"سيناريو شراء إلكتروني - 5 خطوات محمية",flow:["1. تتصفح https://shop.com - HTTPS يمنع قراءة طرف ثالث لمحتوى التصفح","2. المتصفح يتحقق من شهادة shop.com - يتأكد أن الطرف حقيقي وليس مزيف","3. تسجيل الدخول بكلمة مرور + رمز هاتف (2FA) - تقليل الدخول غير المصرح","4. إرسال طلب الشراء - يحمي TLS سرية بيانات البطاقة والعنوان","5. توقيع رقمي للطلب - إثبات أنك أنت من أرسل الطلب (عدم تنصل)"]},{id:16,lesson:1,lessonLabel:"الدرس 2-1",type:"qa",title:"هل الحماية مطلقة؟ - فهم واقعي للأمان",question:"هل جمع هذه التقنيات يجعل النظام آمن 100%؟",answer:"لا. لا توجد حماية مطلقة. الجمع بين التقنيات يقلل بشكل كبير من مخاطر: التنصت، التلاعب، الدخول غير المصرح، انتحال الهوية، لكنه لا يمنعها تماماً دون افتراض منع مطلق. الهدف هو جعل الاختراق صعباً ومكلفاً جداً.",boxes:[{color:"orange",title:"يقلل",text:"مخاطر التنصت والتلاعب"},{color:"blue",title:"يقلل",text:"الدخول غير المصرح وانتحال الهوية"},{color:"green",title:"لا يمنع",text:"مطلقاً - لكن يجعل الهجوم صعب ومكلف"}]},{id:17,lesson:1,lessonLabel:"الدرس 2-1",type:"content",title:"التهديدات الأساسية التي نواجهها",boxes:[{color:"blue",title:"\uD83D\uDC42 التنصت",text:"قراءة البيانات أثناء النقل - يُواجه بالتشفير"},{color:"yellow",title:"✏️ التلاعب",text:"تعديل الرسائل - يُكشف بالتوقيع الرقمي"},{color:"orange",title:"\uD83C\uDFAD انتحال الهوية",text:"ادعاء هوية مزيفة - يُمنع بالشهادات و 2FA"},{color:"green",title:"\uD83D\uDEAA الدخول غير المصرح",text:"دخول حسابات دون إذن - يُقلل بـ 2FA"}]},{id:18,lesson:1,lessonLabel:"الدرس 2-1",type:"qa",title:"لماذا عامل ثانٍ يحميك حتى لو تسربت كلمة المرور؟",question:"إذا عرف المهاجم كلمة مرورك، لماذا لا يستطيع الدخول بوجود 2FA؟",answer:"لأن العامل الثاني من فئة مختلفة ومستقلة: حيازة الهاتف. المهاجم قد يعرف كلمة المرور (معرفة) لكنه لا يملك هاتفك (حيازة). الفئتان مختلفتان ومستقلتان، لذلك حتى مع تسريب واحدة، الثانية تحمي.",boxes:[{color:"green",title:"كلمة مرور",text:"فئة: معرفة - قد تُسرّب"},{color:"blue",title:"هاتف",text:"فئة: حيازة - معك فيزيائياً"},{color:"orange",title:"مستقلان",text:"تسريب واحد لا يكشف الآخر"}]},{id:19,lesson:1,lessonLabel:"الدرس 2-1",type:"comparison",title:"الفرق بين 2FA والتحقق بخطوتين بنفس العامل",points:["2FA الحقيقي: يجب أن يكون العاملان من فئتين مختلفتين","مثال صحيح: كلمة مرور (معرفة) + بصمة (حيوي) = فئتان مختلفتان = 2FA","مثال خاطئ: كلمة مرور + سؤال أمان (كلاهما معرفة) = نفس الفئة = ليس 2FA بل خطوتان بنفس العامل","كلمتي مرور مختلفتين لا تعتبر 2FA لأنهما من نفس الفئة"],boxes:[{color:"green",title:"✅ 2FA صحيح",text:"معرفة + حيازة أو معرفة + حيوي"},{color:"orange",title:"❌ ليس 2FA",text:"كلمتي مرور = نفس الفئة (معرفة + معرفة)"},{color:"blue",title:"القاعدة",text:"يجب فئتين مختلفتين"}]},{id:20,lesson:1,lessonLabel:"الدرس 2-1",type:"content",title:"مطابقة - كل تهديد وتقنية المواجهة",boxes:[{color:"blue",title:"منع قراءة طرف ثالث",text:"← التشفير (متماثل + غير متماثل)"},{color:"purple",title:"تحقق رسالة موقعة لم تتلاعب",text:"← التوقيع الرقمي"},{color:"green",title:"تحقق أن الطرف حقيقي وليس مزيف",text:"← الشهادة الرقمية"},{color:"orange",title:"منع دخول حتى مع تسريب كلمة المرور",text:"← المصادقة الثنائية 2FA"}]},{id:21,lesson:1,lessonLabel:"الدرس 2-1",type:"qa",title:"لماذا لا نشفر جميع البيانات بالمفتاح العام؟",question:"لماذا لا نستخدم التشفير بالمفتاح العام لكل البيانات؟",answer:"لأنه بطيء جداً! التشفير غير المتماثل أبطأ بمئات المرات من المتماثل. لذلك نستخدمه فقط في المصافحة للاتفاق على مفاتيح الجلسة، ثم ننتقل للمتماثل السريع لحماية البيانات الفعلية الكثيرة. كفاءة + أمان.",boxes:[{color:"orange",title:"المفتاح العام",text:"بطيء - للاتفاق فقط"},{color:"green",title:"المتماثل",text:"سريع - للبيانات الكثيرة"},{color:"blue",title:"HTTPS",text:"يجمع الاثنين بذكاء"}]},{id:22,lesson:1,lessonLabel:"الدرس 2-1",type:"content",title:"خطوات HTTPS مرتبة - تسلسل صحيح",flow:["1️⃣ يرسل الخادم شهادته الرقمية - يتحقق المتصفح من صحتها وسلسلة الثقة","2️⃣ يتفق الطرفان على إعدادات التشفير ويشتقان مفاتيح جلسة متماثلة باستخدام المفتاح العام/الخاص","3️⃣ بعد المصافحة، تُحمى جميع البيانات المتبادلة بالتشفير المتماثل السريع"],extraNote:"هذا الترتيب هو جوهر TLS 1.2 و 1.3 - مصادقة ثم اتفاق ثم تشفير سريع"},{id:23,lesson:1,lessonLabel:"الدرس 2-1",type:"qa",title:"لماذا مفاتيح الجلسة المتماثلة أسرع؟",question:"ما الذي يجعل التشفير المتماثل أفضل بعد المصافحة؟",answer:"المتماثل يستخدم عمليات رياضية بسيطة وسريعة (XOR, تبديل) بينما غير المتماثل يستخدم أعداد أولية ضخمة وأسس. لذلك المتماثل أكفأ للبيانات الكثيرة والمستمرة بعد الاتفاق الآمن على المفتاح.",boxes:[{color:"green",title:"متماثل",text:"عمليات بسيطة - سريع - للبث"},{color:"blue",title:"غير متماثل",text:"أعداد ضخمة - بطيء - للاتفاق"}]},{id:24,lesson:1,lessonLabel:"الدرس 2-1",type:"content",title:"إجابة السؤال الرئيسي - كيف تتعاون المصادقة والتشفير؟",points:["HTTPS عبر TLS مؤمن: يبدأ بشهادات وآليات المفتاح العام للمصادقة وإنشاء مفاتيح جلسة","ثم المتماثل يحمي بكفاءة: بعد الاتفاق، كل البيانات تُحمى بالتشفير المتماثل السريع","2FA تقلل الدخول غير المصرح: حتى لو تسربت كلمة المرور، العامل الثاني يحمي","الشهادات والتوقيعات وظائف مختلفة لكن متكاملة: الشهادة للهوية، التوقيع للسلامة وعدم التنصل","الحماية طبقات تقلل المخاطر: لا نعتمد على تقنية واحدة بل نكدسها"],boxes:[{color:"blue",title:"TLS",text:"مصادقة + اتفاق مفاتيح"},{color:"green",title:"متماثل",text:"حماية سريعة للبيانات"},{color:"orange",title:"2FA + شهادة + توقيع",text:"طبقات إضافية تقلل المخاطر"}]},{id:25,lesson:1,lessonLabel:"الدرس 2-1",type:"summary",title:"خلاصة الدرس 2-1",points:["مصافحة HTTPS تستخدم المفتاح العام للمصادقة والاتفاق على أسرار تشتق منها مفاتيح الجلسة","ثم تُحمى البيانات بالمتماثل بسرعة وكفاءة","الخدمات الآمنة تحافظ على نفسها بتكديس: التشفير + الشهادات + التوقيعات + 2FA","لا حماية مطلقة، لكن التكديس يجعل الاختراق صعباً ومكلفاً","تذكر: العام للاتصال والمصادقة، المتماثل لحماية البيانات الفعلية"],boxes:[{color:"blue",title:"\uD83D\uDD11 القاعدة الذهبية",text:"العام للمصافحة، المتماثل للبيانات"},{color:"green",title:"\uD83D\uDEE1️ الحماية",text:"طبقات متعددة تقلل المخاطر"}]},{id:26,lesson:1,lessonLabel:"الدرس 2-1",type:"qa",title:"مراجعة سريعة - اختبر فهمك",boxes:[{color:"blue",title:"س1: ما الفرق بين التشفير والتوقيع؟",text:"التشفير يمنع القراءة، التوقيع يكشف التلاعب ويثبت الهوية"},{color:"green",title:"س2: لماذا نحتاج شهادة؟",text:"للتأكد أن الخادم هو فعلاً من يدعي أنه هو"},{color:"orange",title:"س3: هل كلمتي مرور = 2FA؟",text:"لا، نفس الفئة (معرفة) - يجب فئتين مختلفتين"},{color:"yellow",title:"س4: لماذا متماثل بعد المصافحة؟",text:"لأنه أسرع وأكفأ للبيانات الكبيرة"}]},{id:27,lesson:1,lessonLabel:"الدرس 2-1",type:"scenario",title:"نشاط تطبيقي - حلل هذا الموقف",subtitle:"موقع يطلب فقط كلمة مرور للدخول لحساب بنكي - ما المخاطر؟ وما الحل؟",points:["المخاطر: إذا تسربت كلمة المرور (تصيد، تسريب)، المهاجم يدخل مباشرة","لا يوجد عامل ثانٍ من فئة مختلفة - نقطة فشل واحدة","الحل: إضافة 2FA (رمز هاتف + كلمة مرور) + شهادة صحيحة + HTTPS + تنبيهات دخول","التوقيع الرقمي للمعاملات المالية لضمان عدم التنصل"]},{id:28,lesson:1,lessonLabel:"الدرس 2-1",type:"content",title:"انتقال - ماذا بعد التشفير؟",subtitle:"عرفنا كيف نحمي الاتصال الواحد، لكن كيف نحمي الشبكة كلها؟",points:["الدرس 2-1 ركز على تأمين اتصال واحد بين متصفح وخادم","لكن المؤسسة لديها عشرات الخوادم ومئات الأجهزة وآلاف المستخدمين","هل جدار حماية واحد يكفي؟ هل الشبكة الداخلية آمنة تلقائياً؟","الدرس القادم 2-2: تصميم أمان الشبكات - الدفاع في العمق و Zero Trust"],boxes:[{color:"blue",title:"انتهى 2-1",text:"28 شريحة - تقنيات التشفير والمصادقة"},{color:"orange",title:"التالي 2-2",text:"42 شريحة - تصميم أمان الشبكات"}]},{id:29,lesson:2,lessonLabel:"الدرس 2-2",type:"cover",title:"تصميم أمان الشبكات",subtitle:"كيف نبني شبكة تظل محمية حتى لو فشلت إحدى طبقات الدفاع؟",tags:["Firewall","VPN","DMZ","Zero Trust","الدفاع في العمق"]},{id:30,lesson:2,lessonLabel:"الدرس 2-2",type:"objectives",title:"أهداف الدرس 2-2",points:["وصف مفهوم الدفاع في العمق ولماذا نكدس الإجراءات في طبقات متعددة","شرح دور كل من: جدار الحماية، VPN، DMZ، حماية الأجهزة الطرفية","مقارنة بين نموذج الأمان التقليدي (المحيط) ونموذج انعدام الثقة Zero Trust"],boxes:[{color:"blue",title:"الدفاع في العمق",text:"طبقات متعددة - إذا فشلت واحدة، الباقي يحمي"},{color:"green",title:"Zero Trust",text:"لا ثقة تلقائية - تحقق عند كل وصول"},{color:"orange",title:"أدوات",text:"Firewall + VPN + DMZ + Endpoint"}]},{id:31,lesson:2,lessonLabel:"الدرس 2-2",type:"map",title:"خريطة المفاهيم - أمان الشبكات",subtitle:"الفكرة: أمان الشبكات القوي يأتي من تكديس الإجراءات وليس الاعتماد على واحدة",boxes:[{color:"blue",title:"جدار الحماية",text:"يراقب الحركة، يسمح/يمنع حسب قواعد محددة مسبقاً"},{color:"green",title:"VPN",text:"نفق مشفر عبر شبكة عامة - يحمي من التنصت"},{color:"yellow",title:"DMZ",text:"منطقة معزولة للخوادم العامة - فصل عن الداخلية"},{color:"orange",title:"حماية الأجهزة + Zero Trust",text:"مكافح فيروسات + تحديثات + تحقق من كل وصول"}]},{id:32,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"جدار الحماية Firewall - التعريف",points:["نظام يراقب حركة الشبكة ويسمح أو يمنع وفق قواعد محددة مسبقاً","قد يكون عند حدود الشبكة (Perimeter Firewall) أو بين أجزائها أو على مضيف (Host Firewall)","يسمح أو يمنع عند نقطة دخول/خروج استناداً إلى: IP، منفذ، بروتوكول، محتوى","ليس حل سحري - طبقة واحدة من عدة طبقات"],boxes:[{color:"blue",title:"ما هو؟",text:"حارس يراقب الحركة ويطبق قواعد"},{color:"green",title:"أين؟",text:"حدود الشبكة، بين الأجزاء، على الجهاز"},{color:"orange",title:"كيف؟",text:"يسمح/يمنع حسب IP، منفذ، بروتوكول"}]},{id:33,lesson:2,lessonLabel:"الدرس 2-2",type:"scenario",title:"مثال قواعد جدار الحماية",boxes:[{color:"green",title:"✅ السماح",text:"السماح للجميع بالوصول لخادم الويب على المنفذ 443 (HTTPS)"},{color:"blue",title:"✅ السماح",text:"السماح لخادم الويب بالوصول لقاعدة البيانات على منفذ داخلي فقط"},{color:"orange",title:"❌ المنع",text:"منع الوصول الخارجي المباشر لقاعدة البيانات - لا أحد من الإنترنت يصل لها مباشرة"},{color:"yellow",title:"❌ المنع",text:"منع كل الحركة من IP مشبوه معروف بالهجمات"}]},{id:34,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"VPN - الشبكة الخاصة الافتراضية",points:["اتصال منطقي خاص عبر شبكة عامة (مثل الإنترنت) باستخدام التشفير والنفق","تنقل البيانات بأمان عبر شبكة غير موثوقة - كأنك داخل شبكة المؤسسة وأنت في المنزل","تستخدم التشفير (مثل IPsec, SSL/TLS) لإنشاء نفق آمن","تقلل مخاطر التنصت حتى عند استخدام WiFi عامة في مقهى أو مطار"],boxes:[{color:"green",title:"ما هي؟",text:"نفق مشفر عبر الإنترنت العام"},{color:"blue",title:"كيف تحمي؟",text:"تشفير + نفق = لا أحد يقرأ حتى على WiFi عام"},{color:"purple",title:"النتيجة",text:"كأنك داخل الشركة وأنت بعيد"}]},{id:35,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"استخدامات VPN",boxes:[{color:"blue",title:"\uD83C\uDFE0 العمل عن بعد",text:"الاتصال بشبكة المؤسسة بأمان من المنزل أو أثناء التنقل"},{color:"green",title:"\uD83C\uDFE2 ربط الفروع",text:"ربط فروع الشركة المختلفة عبر الإنترنت بأمان بدل خطوط مكلفة"},{color:"orange",title:"☕ حماية على WiFi عام",text:"حتى لو الشبكة غير موثوقة، بياناتك مشفرة داخل النفق"},{color:"yellow",title:"\uD83C\uDF0D تجاوز جغرافي آمن",text:"وصول آمن لموارد داخلية من أي مكان"}]},{id:36,lesson:2,lessonLabel:"الدرس 2-2",type:"qa",title:"كيف يقلل VPN من التنصت؟",question:"أنت في مقهى تستخدم WiFi عام بدون VPN - ما الخطر؟ ومع VPN؟",answer:"بدون VPN: أي شخص على نفس الشبكة قد يتنصت ويقرأ بياناتك غير المشفرة. مع VPN: محتوى الاتصال يُشفر عند استخدام VPN، فتقل مخاطر التنصت حتى على WiFi عامة لأن المهاجم يرى فقط بيانات مشفرة غير مفهومة.",boxes:[{color:"orange",title:"بدون VPN",text:"خطر تنصت عالي على WiFi عام"},{color:"green",title:"مع VPN",text:"بيانات مشفرة - التنصت لا يفيد"}]},{id:37,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"DMZ - المنطقة المنزوعة السلاح",points:["منطقة توضع فيها الخوادم المعرضة للشبكة الخارجية (ويب، بريد) بشكل منفصل عن الشبكة الداخلية","منطقة مواجهة للجمهور منفصلة - لا هي داخلية تماماً ولا خارجية تماماً","بين جدارين حماية: واحد بين الإنترنت و DMZ، وآخر بين DMZ والداخلية","إذا اخترق خادم في DMZ، لا يزال هناك جدار حماية يحمي الداخلية"],boxes:[{color:"yellow",title:"ما هي؟",text:"منطقة وسطى للخوادم العامة المعرضة للإنترنت"},{color:"blue",title:"ماذا فيها؟",text:"خادم ويب، خادم بريد - خدمات للجمهور"},{color:"green",title:"لماذا؟",text:"عزل - اختراقها لا يكشف الداخلية مباشرة"}]},{id:38,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"فائدة فصل الخوادم العامة في DMZ",points:["تقليل احتمال وصول الهجوم للشبكة الداخلية إذا تعرض أحد الخوادم العامة للاختراق","الخادم العام معرض أكثر لأنه متاح للجميع - وضعه في DMZ يحصر الضرر","قاعدة البيانات السرية تبقى في الداخلية، لا تصل لها مباشرة من الإنترنت","تطبيق مبدأ أقل صلاحية: كل خادم في مكانه المناسب حسب حساسيته"],boxes:[{color:"green",title:"عزل الضرر",text:"اختراق DMZ ≠ اختراق الداخلية"},{color:"blue",title:"حماية البيانات الحساسة",text:"قاعدة البيانات في الداخلية، ليست في DMZ"}]},{id:39,lesson:2,lessonLabel:"الدرس 2-2",type:"qa",title:"لماذا وضع خادم ويب عام في DMZ أكثر أماناً؟",question:"خادم ويب داخل الشبكة الداخلية vs في DMZ - ما الفرق إذا هوجم؟",answer:"إذا هوجم خادم في DMZ، الشبكة الداخلية ما زالت محمية بجدار حماية ثانٍ. بينما لو كان خادم الويب داخل الداخلية مباشرة، فاختراقه يكشف الشبكة كلها مباشرة - المهاجم أصبح داخل الشبكة الحساسة.",boxes:[{color:"green",title:"في DMZ",text:"هوجم → الداخلية محمية بجدار ثانٍ"},{color:"orange",title:"داخل الداخلية",text:"هوجم → الشبكة كلها مكشوفة مباشرة"}]},{id:40,lesson:2,lessonLabel:"الدرس 2-2",type:"diagram",title:"تكوين DMZ - رسم توضيحي",flow:["\uD83C\uDF0D الإنترنت: مستخدمون + مهاجم محتمل","\uD83D\uDD25 جدار حماية 1: بين الخارجية و DMZ - يسمح فقط 80/443 للويب","\uD83D\uDFE8 DMZ: خادم ويب عام + خادم بريد - معرضة للجمهور لكن معزولة","\uD83D\uDD25 جدار حماية 2: بين DMZ والداخلية - يمنع وصول DMZ للداخلية إلا لمنافذ محددة","\uD83D\uDFE6 الداخلية: قاعدة بيانات + كمبيوتر بيانات سرية - لا وصول مباشر من الإنترنت","✅ النتيجة: حتى لو اخترق الويب في DMZ، لا يصل لقاعدة البيانات مباشرة"]},{id:41,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"الدفاع في العمق - المفهوم الأساسي",points:["استخدام طبقات متعددة من الضوابط الأمنية بحيث إذا فشلت إحدى الطبقات، تساعد طبقات أخرى على تقليل الخطر والحد من أثر الاختراق","تكديس الإجراءات في طبقات متعددة - ليس اعتماد على جدار واحد أو تقنية واحدة","مثل القلعة: خندق + سور خارجي + سور داخلي + حراس - كل طبقة تعزز الأخرى","الهدف: لا يؤدي فشل وسيلة واحدة إلى كشف النظام كله"],boxes:[{color:"blue",title:"التعريف",text:"طبقات متعددة - إذا فشلت واحدة، الباقي يقلل الخطر"},{color:"orange",title:"التشبيه",text:"قلعة: خندق + أسوار + حراس"},{color:"green",title:"الهدف",text:"فشل واحد ≠ كشف النظام كله"}]},{id:42,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"الطبقات الأربع للدفاع في العمق (1-2)",boxes:[{color:"blue",title:"1. مدخل الشبكة - جدار الحماية",text:"منع الاتصال غير المصرح به باستخدام جدار الحماية عند الحدود وبين الأجزاء. يسمح/يمنع حسب قواعد"},{color:"green",title:"2. مسار الاتصال - VPN",text:"تشفير مسار الاتصال باستخدام VPN - حتى لو اعترض أحد البيانات، لا يقرأها. يحمي من التنصت"}],points:["كل طبقة لها وظيفة مختلفة لكن متكاملة","الطبقة 1 تمنع الدخول غير المصرح","الطبقة 2 تحمي البيانات أثناء النقل"]},{id:43,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"الطبقات الأربع (3-4)",boxes:[{color:"yellow",title:"3. وضع الخوادم - DMZ",text:"فصل الخوادم المواجهة للجمهور عن الداخلية باستخدام DMZ - عزل الضرر إذا اخترق خادم عام"},{color:"orange",title:"4. الأجهزة الطرفية - Endpoint",text:"تثبيت مكافحة فيروسات، تحديث نظام التشغيل، تشفير الأقراص، سياسات كلمات مرور"}],points:["الطبقة 3 تحمي عبر التقسيم والعزل","الطبقة 4 تحمي كل جهاز كنقطة أخيرة","معاً: مدخل + مسار + وضع + جهاز = دفاع متكامل"]},{id:44,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"الطبقة 3 بالتفصيل - DMZ",points:["وضع الخوادم العامة (ويب، بريد) في منطقة معزولة عن الداخلية","جدار حماية بين الإنترنت و DMZ يسمح فقط بالمنافذ العامة (80, 443)","جدار حماية ثانٍ بين DMZ والداخلية يسمح فقط باتصالات محددة من DMZ للداخلية","قاعدة البيانات لا توضع أبداً في DMZ - تبقى في الداخلية المحمية"]},{id:45,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"الطبقة 4 - حماية الأجهزة الطرفية",boxes:[{color:"blue",title:"\uD83D\uDEE1️ مكافحة فيروسات",text:"كشف البرمجيات الخبيثة على كل جهاز"},{color:"green",title:"\uD83D\uDD04 تحديثات",text:"سد الثغرات - تحديث نظام التشغيل والتطبيقات"},{color:"orange",title:"\uD83D\uDD10 تشفير",text:"تشفير الأقراص - حتى لو سُرق الجهاز، البيانات محمية"},{color:"yellow",title:"\uD83D\uDCCB سياسات",text:"كلمات مرور قوية + قفل تلقائي + تدريب المستخدمين"}]},{id:46,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"Zero Trust - انعدام الثقة",points:["نهج أمني لا يمنح الثقة تلقائياً لمستخدم أو جهاز لمجرد وجوده داخل الشبكة أو ملكيته للمؤسسة","يتم فحص الهوية والصلاحيات والسياق عند طلب الوصول إلى الموارد وفق سياسة المؤسسة","التحقق من كل عملية وصول - ليس مرة واحدة عند الدخول ثم ثقة دائمة","المبدأ: لا تثق أبداً، تحقق دائماً (Never Trust, Always Verify)"],boxes:[{color:"orange",title:"المبدأ",text:"لا ثقة تلقائية لمجرد وجودك داخل الشبكة"},{color:"blue",title:"التحقق",text:"هوية + صلاحيات + سياق عند كل طلب وصول"},{color:"green",title:"الشعار",text:"Never Trust, Always Verify"}]},{id:47,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"المحيط الأمني والأمان التقليدي",points:["تصميم تقليدي مبني بشكل أساسي حول المحيط - جدار حماية قوي عند الحدود","فرضية: داخل شبكة المؤسسة آمن وخارجها خطر - من داخل الشبكة يُوثق به تلقائياً","كان يعمل عندما كانت كل الأجهزة داخل المبنى والخوادم داخلية","الآن مع السحابة والعمل عن بعد، الحدود غير واضحة - من هو داخل ومن خارج؟"],boxes:[{color:"blue",title:"التقليدي",text:"محيط قوي - داخل آمن، خارج خطر"},{color:"orange",title:"الفرضية",text:"داخل الشبكة = موثوق تلقائياً"},{color:"yellow",title:"المشكلة الآن",text:"السحابة والعمل عن بعد - أين الحدود؟"}]},{id:48,lesson:2,lessonLabel:"الدرس 2-2",type:"qa",title:"لماذا لم يعد الأمان التقليدي كافياً؟",question:"مع انتشار السحابية والعمل عن بعد، لماذا المحيط وحده لا يكفي؟",answer:"لأن الحدود أصبحت غير واضحة. الموظف يعمل من المنزل، البيانات في السحابة، الفروع متصلة عبر الإنترنت. تصاميم تحمي المحيط فقط غير كافية لأن 'الداخل' لم يعد مكاناً جغرافياً واضحاً. نحتاج تحقق من كل وصول بغض النظر عن الموقع.",boxes:[{color:"orange",title:"الماضي",text:"كل شيء داخل المبنى - محيط واضح"},{color:"blue",title:"الآن",text:"سحابة + عن بعد + فروع - حدود ضبابية"},{color:"green",title:"الحل",text:"Zero Trust - لا تعتمد على الموقع"}]},{id:49,lesson:2,lessonLabel:"الدرس 2-2",type:"comparison",title:"الفرق: التقليدي vs انعدام الثقة",boxes:[{color:"blue",title:"التقليدي \uD83C\uDFF0",text:"داخل آمن وخارج خطر. يعتمد على المحيط. ثقة تلقائية لمن في الداخل. جدار واحد قوي"},{color:"orange",title:"Zero Trust \uD83D\uDD0D",text:"لا يمنح ثقة تلقائية بناء على موقع المستخدم أو الجهاز. يطلب التحقق من الهوية والصلاحيات والسياق عند كل طلب وصول. تحقق مستمر"}],points:["التقليدي: مرة واحدة تثبت أنك داخل، يثق بك دائماً","Zero Trust: كل مرة تطلب مورد، يجب التحقق من جديد","Zero Trust مناسب للسحابة والعمل عن بعد والفروع المتعددة"]},{id:50,lesson:2,lessonLabel:"الدرس 2-2",type:"qa",title:"هل جدار الحماية وحده كافٍ؟",question:"مؤسسة لديها جدار حماية قوي فقط - هل هي محمية؟",answer:"لا. تكديس عدة إجراءات في طبقات الدفاع في العمق يحمي أفضل من الاعتماد على جدار وحده. إذا اخترق إجراء، تبقى طبقات أخرى تقلل الخطر. لو فشل جدار الحماية، VPN تشفر، DMZ تعزل، الأجهزة محمية. طبقة واحدة = نقطة فشل واحدة.",boxes:[{color:"orange",title:"جدار وحده",text:"نقطة فشل واحدة - إذا سقط، كل شيء مكشوف"},{color:"green",title:"طبقات متعددة",text:"فشل واحدة ≠ كشف النظام كله"}]},{id:51,lesson:2,lessonLabel:"الدرس 2-2",type:"scenario",title:"سيناريو مؤسسة صغيرة - تطبيق عملي",points:["مؤسسة 50 موظف، خادم ويب، قاعدة بيانات عملاء، موظفون يعملون من المنزل أحياناً","التصميم: جدار حماية عند الحدود + DMZ للويب + VPN للعمل عن بعد + حماية أجهزة","الويب في DMZ، قاعدة البيانات في الداخلية، لا وصول مباشر من الإنترنت لها","الموظفون عن بعد يدخلون عبر VPN فقط مع 2FA، ثم Zero Trust للوصول للموارد"]},{id:52,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"السؤال الرئيسي للدرس 2-2",subtitle:"كيف يمكن لمؤسسة تصميم شبكتها بحيث يظل محمياً حتى لو اخترق أحد الدفاعات؟",boxes:[{color:"blue",title:"السؤال",text:"كيف لا يؤدي فشل واحد إلى كشف النظام كله؟"},{color:"orange",title:"التفكير",text:"تكديس + عزل + تحقق مستمر"}],points:["هذا هو جوهر الدفاع في العمق و Zero Trust","الإجابة في الشريحة القادمة بتفصيل"]},{id:53,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"إجابة السؤال الرئيسي - تصميم شبكة مرنة",points:["تصميم شبكة لا يؤدي فشل وسيلة واحدة فيها إلى كشف النظام كله","جدار الحماية يراقب حركة الشبكة ويسمح/يمنع حسب قواعد","VPN تحمي الاتصال البعيد بتشفيره حتى على شبكات غير موثوقة","DMZ تفصل الخوادم العامة عن الداخلية - عزل الضرر","ضوابط الأجهزة تحمي كل جهاز كنقطة أخيرة","مع السحابة والعمل عن بعد، الاعتماد على موقع المستخدم داخل الشبكة أقل دليلاً على الثقة، لذلك Zero Trust لا يمنح ثقة تلقائية بل يطلب التحقق من الهوية والصلاحيات عند الوصول","هذه الطبقات تعمل معاً للحد من أثر الاختراق"],boxes:[{color:"blue",title:"جدار حماية",text:"يراقب ويمنع"},{color:"green",title:"VPN",text:"يشفر الاتصال البعيد"},{color:"yellow",title:"DMZ",text:"يعزل الخوادم العامة"},{color:"orange",title:"Zero Trust",text:"تحقق عند كل وصول"}]},{id:54,lesson:2,lessonLabel:"الدرس 2-2",type:"summary",title:"خلاصة جزء 1 - الدفاع في العمق",points:["كدس دفاعات: جدار الحماية + VPN + DMZ + حماية الأجهزة الطرفية","تحقق من كل عملية وصول (Zero Trust) - لا ثقة تلقائية","عندها غير مرجح أن خرق واحد يكشف الشبكة بأكملها","كل طبقة تقلل الخطر وتحد من الأثر إذا فشلت طبقة أخرى"]},{id:55,lesson:2,lessonLabel:"الدرس 2-2",type:"diagram",title:"مخطط الدفاع في العمق التكاملي",flow:["\uD83D\uDD25 الطبقة 1: جدار الحماية - يمنع الاتصال غير المصرح عند المدخل","\uD83D\uDD10 الطبقة 2: VPN - يشفر مسار الاتصال، يحمي من التنصت","\uD83D\uDFE8 الطبقة 3: DMZ - يعزل الخوادم العامة عن الداخلية","\uD83D\uDCBB الطبقة 4: الأجهزة - مكافح فيروسات + تحديثات + تشفير","\uD83D\uDD0D فوق الكل: Zero Trust - تحقق من الهوية والصلاحيات والسياق عند كل وصول","✅ النتيجة: فشل طبقة واحدة لا يكشف النظام كله"]},{id:56,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"أمثلة سياسات جدار الحماية المتقدمة",boxes:[{color:"blue",title:"قاعدة 1",text:"السماح لخادم الويب (DMZ) بالوصول لقاعدة البيانات (الداخلية) على منفذ 3306 فقط"},{color:"green",title:"قاعدة 2",text:"منع أي وصول مباشر من الإنترنت لقاعدة البيانات"},{color:"orange",title:"قاعدة 3",text:"السماح للموظفين عبر VPN فقط بالوصول للشبكة الداخلية"},{color:"yellow",title:"قاعدة 4",text:"تسجيل كل محاولات الوصول المرفوضة للمراجعة"}]},{id:57,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"أنواع جدران الحماية",boxes:[{color:"blue",title:"تصفية الحزم",text:"يفحص IP ومنفذ وبروتوكول - سريع لكن بسيط"},{color:"green",title:"حالة الاتصال Stateful",text:"يتتبع حالة الاتصال - أذكى"},{color:"orange",title:"تطبيقي WAF",text:"يفحص محتوى HTTP - يحمي من SQL Injection"},{color:"yellow",title:"الجيل القادم NGFW",text:"يجمع كل شيء + كشف التطبيقات + IPS"}]},{id:58,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"VPN - النفق والتشفير شرح تقني",points:["النفق: تغليف الحزمة الأصلية داخل حزمة جديدة مشفرة","التشفير: IPsec أو SSL/TLS يحمي المحتوى","المصادقة: التأكد أن الطرف الآخر هو فعلاً خادم الشركة وليس مزيف","الأنواع: Site-to-Site (فرع لفرع)، Remote Access (موظف لشركة)"],boxes:[{color:"blue",title:"النفق",text:"تغليف الحزمة داخل حزمة"},{color:"green",title:"التشفير",text:"لا أحد يقرأ المحتوى"},{color:"orange",title:"المصادقة",text:"التأكد من هوية الطرفين"}]},{id:59,lesson:2,lessonLabel:"الدرس 2-2",type:"scenario",title:"سيناريو ربط الفروع عبر VPN",flow:["\uD83C\uDFE2 فرع الرياض: شبكة 192.168.1.0/24","\uD83C\uDFE2 فرع جدة: شبكة 192.168.2.0/24","\uD83C\uDF10 الإنترنت العام بينهما - غير آمن","\uD83D\uDD10 VPN Site-to-Site: نفق مشفر IPsec بين جداري الحماية","✅ النتيجة: الفرعان كأنهما شبكة واحدة آمنة، كل حركة بينهما مشفرة","\uD83D\uDCB0 التوفير: أرخص من خط مؤجر مخصص، وأكثر أماناً من الإنترنت المفتوح"]},{id:60,lesson:2,lessonLabel:"الدرس 2-2",type:"qa",title:"مخاطر عدم وجود DMZ",question:"ماذا لو وضعنا خادم الويب مباشرة في الداخلية بدون DMZ؟",answer:"إذا اخترق خادم الويب (وهو معرض للإنترنت)، المهاجم أصبح داخل الشبكة الداخلية مباشرة ويستطيع الوصول لقاعدة البيانات والملفات السرية. مع DMZ، حتى لو اخترق الويب، لا يزال هناك جدار حماية ثانٍ يمنعه من الوصول للداخلية بسهولة.",boxes:[{color:"orange",title:"بدون DMZ",text:"اختراق ويب = وصول مباشر للداخلية"},{color:"green",title:"مع DMZ",text:"اختراق ويب = محصور في DMZ، جدار ثانٍ يحمي"}]},{id:61,lesson:2,lessonLabel:"الدرس 2-2",type:"diagram",title:"تصميم شبكة بثلاث مناطق - معياري",flow:["المنطقة 1 - الإنترنت: 0.0.0.0/0 - غير موثوقة","المنطقة 2 - DMZ: 10.0.1.0/24 - خوادم ويب وبريد - شبه موثوقة","المنطقة 3 - الداخلية: 10.0.0.0/24 - قواعد بيانات وملفات - موثوقة لكن محمية","جدار 1: Internet → DMZ: السماح 80,443 فقط","جدار 2: DMZ → Internal: السماح من ويب لقاعدة بيانات على 3306 فقط","جدار 2: Internet → Internal: منع كامل مباشر"]},{id:62,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"تكامل الجدار مع DMZ - قواعد متقدمة",points:["جدار خارجي: يسمح للإنترنت بالوصول لـ DMZ فقط على المنافذ العامة","جدار داخلي: يسمح لـ DMZ بالوصول للداخلية فقط لمنافذ محددة ومصادر محددة","لا يسمح أبداً بوصول من DMZ للداخلية على منافذ إدارة (22, 3389)","تسجيل كل الحركة بين المناطق للمراجعة وكشف الشذوذ"]},{id:63,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"دور حماية الأجهزة الطرفية - آخر خط دفاع",points:["حتى مع جدار و VPN و DMZ، إذا أصيب جهاز موظف ببرمجية خبيثة، قد تنتشر","مكافح الفيروسات يكشف ويعزل البرمجيات الخبيثة","تحديثات النظام تسد الثغرات التي تستغلها البرمجيات","تشفير القرص يحمي البيانات حتى لو سُرق الجهاز","التدريب: المستخدم هو أضعف حلقة - تدريبه على التصيد والروابط المشبوهة"],boxes:[{color:"blue",title:"تقني",text:"مكافح + تحديثات + تشفير"},{color:"green",title:"بشري",text:"تدريب المستخدمين على التصيد"},{color:"orange",title:"سياسات",text:"قفل تلقائي + كلمات مرور قوية"}]},{id:64,lesson:2,lessonLabel:"الدرس 2-2",type:"scenario",title:"مثال هجوم يتجاوز طبقة واحدة لكن يُوقف بالباقي",flow:["\uD83C\uDFAF هجوم: موظف يفتح مرفق تصيد - برمجية خبيثة على جهازه","\uD83D\uDD25 جدار الحماية: لم يمنعه لأنه بريد شرعي مر عبر 443","\uD83D\uDCBB حماية الأجهزة: مكافح الفيروسات يكشف البرمجية ويعزلها","لو فشل المكافح: جدار داخلي يمنع الجهاز المصاب من الوصول لقاعدة البيانات","\uD83D\uDD0D Zero Trust: حتى لو حاول الوصول، يُطلب تحقق إضافي لأنه سلوك غير معتاد","✅ النتيجة: طبقات متعددة أوقفت الهجوم رغم فشل طبقة"]},{id:65,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"Zero Trust - المبادئ الأساسية الثلاثة",boxes:[{color:"blue",title:"1. لا تثق أبداً",text:"لا تمنح ثقة تلقائية بناء على الموقع أو الملكية"},{color:"green",title:"2. تحقق دائماً",text:"تحقق من الهوية والصلاحيات والسياق عند كل وصول"},{color:"orange",title:"3. أقل صلاحية",text:"امنح أقل صلاحية لازمة لإنجاز المهمة، ولمدة قصيرة"}],points:["تطبيق: كل طلب وصول يُقيّم: من أنت؟ من أي جهاز؟ هل الجهاز سليم؟ هل السلوك طبيعي؟","حتى لو كنت داخل الشبكة، لا تصل لقاعدة البيانات إلا إذا لك صلاحية وسبب"]},{id:66,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"التحقق المستمر في Zero Trust",points:["ليس تحقق مرة واحدة عند تسجيل الدخول ثم ثقة دائمة","تحقق مستمر: كل طلب وصول يُفحص - هل ما زال المستخدم هو نفسه؟ هل الجهاز ما زال آمن؟","السياق: موقع المستخدم، وقت الوصول، الجهاز، السلوك السابق - كلها تؤثر","إذا تغير السياق (دخول من بلد غريب، جهاز جديد)، يُطلب تحقق إضافي أو يُمنع"],boxes:[{color:"purple",title:"مستمر",text:"تحقق عند كل طلب، ليس مرة واحدة"},{color:"blue",title:"سياقي",text:"موقع + جهاز + وقت + سلوك"},{color:"orange",title:"تكيفي",text:"إذا تغير السياق، تحقق إضافي"}]},{id:67,lesson:2,lessonLabel:"الدرس 2-2",type:"comparison",title:"مقارنة تكلفة وفعالية - لماذا الطبقات أفضل؟",boxes:[{color:"blue",title:"جدار واحد قوي جداً",text:"تكلفة عالية، نقطة فشل واحدة، إذا اخترق = كل شيء مكشوف"},{color:"green",title:"طبقات متعددة متوسطة",text:"تكلفة موزعة، لا نقطة فشل واحدة، اختراق طبقة لا يكشف الباقي، فعالية أعلى إجمالاً"}],points:["الاستثمار في طبقات متعددة أرخص وأكثر فعالية من طبقة واحدة خارقة","مثل: قفل باب قوي واحد vs قفل متوسط + كاميرا + إنذار + جار يراقب"]},{id:68,lesson:2,lessonLabel:"الدرس 2-2",type:"content",title:"تحديات تطبيق Zero Trust",points:["تحدي ثقافي: المستخدمون اعتادوا ثقة تلقائية - الآن يُطلب تحقق متكرر","تحدي تقني: يحتاج أنظمة تحقق هوية قوية، إدارة صلاحيات دقيقة، مراقبة سلوك","تحدي تكلفة: يحتاج استثمار في أدوات جديدة وتدريب","لكنه ضروري مع السحابة والعمل عن بعد - لا مفر مع الحدود الضبابية"],boxes:[{color:"yellow",title:"ثقافي",text:"مقاومة المستخدمين للتحقق المتكرر"},{color:"blue",title:"تقني",text:"يحتاج أنظمة متقدمة"},{color:"green",title:"ضرورة",text:"لا مفر مع السحابة والعمل عن بعد"}]},{id:69,lesson:2,lessonLabel:"الدرس 2-2",type:"qa",title:"أسئلة مراجعة - جدار الحماية",boxes:[{color:"blue",title:"س1: ما وظيفة جدار الحماية؟",text:"يراقب الحركة ويسمح/يمنع حسب قواعد محددة مسبقاً"},{color:"green",title:"س2: أين يوضع؟",text:"عند الحدود، بين أجزاء الشبكة، على المضيف"},{color:"orange",title:"س3: هل يكفي وحده؟",text:"لا - طبقة واحدة = نقطة فشل واحدة"}]},{id:70,lesson:2,lessonLabel:"الدرس 2-2",type:"summary",title:"خلاصة نهائية الدرس 2-2",points:["الدفاع في العمق: كدس طبقات - جدار + VPN + DMZ + أجهزة","Zero Trust: لا ثقة تلقائية - تحقق من كل وصول","التقليدي (محيط) لم يعد كافياً مع السحابة والعمل عن بعد","التصميم الجيد: فشل طبقة واحدة لا يكشف النظام كله","التكامل: كل طبقة تعزز الأخرى - معاً أقوى"],boxes:[{color:"blue",title:"القاعدة",text:"كدس دفاعات + تحقق مستمر"},{color:"green",title:"النتيجة",text:"خرق واحد لا يكشف الشبكة بأكملها"}]},{id:71,lesson:3,lessonLabel:"الدرس 2-3",type:"cover",title:"الاستجابة للحوادث وإدارة المخاطر",subtitle:"كيف نستجيب لحادث أمني بفعالية؟ وكيف نحدد أولويات المخاطر؟",tags:["المراحل الست","تقييم المخاطر","التأثير × الاحتمالية","مصفوفة المخاطر"]},{id:72,lesson:3,lessonLabel:"الدرس 2-3",type:"objectives",title:"أهداف الدرس 2-3",points:["وصف المراحل الست للاستجابة للحوادث وفهم تسلسلها مع إمكانية التداخل","فهم كيفية تقييم المخاطر باستخدام معادلة: درجة الخطر = التأثير × الاحتمالية","تطبيق المفاهيم في سيناريوهات واقعية مثل هجوم الفدية وتسرب البيانات"],boxes:[{color:"blue",title:"6 مراحل",text:"تحضير → اكتشاف → احتواء → استئصال → استعادة → دروس"},{color:"orange",title:"تقييم المخاطر",text:"التأثير × الاحتمالية = الأولوية"},{color:"green",title:"تطبيق",text:"سيناريوهات واقعية - فدية، تسرب، انقطاع"}]},{id:73,lesson:3,lessonLabel:"الدرس 2-3",type:"map",ti لضرر - عزل المصاب","4️⃣ الاستئصال: إزالة التهديد ومسبباته - حذف البرمجيات الخبيثة، معالجة الثغرة","5️⃣ الاستعادة: إعادة الأنظمة والخدمات إلى حالة طبيعية آمنة - من نسخة احتياطية سليمة","6️⃣ الدروس المستفادة: تحليل ما حدث وتوثيق الدروس وتحسين الضوابط"]},{id:77,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"المرحلة 1 - التحضير",points:["إنشاء إجراءات وهياكل استجابة مسبقاً قبل وقوع أي حادث","إعداد فريق استجابة، تحديد أدوار، تجهيز أدوات، تدريب","إنشاء نسخ احتياطية منتظمة واختبارها، وخطط استمرارية","كلما كان التحضير أفضل، كانت الاستجابة أسرع وأقل ضرراً","بدون تحضير، عند وقوع الحادث = فوضى وتأخر"],boxes:[{color:"blue",title:"ماذا؟",text:"إجراءات وهياكل استجابة مسبقاً"},{color:"green",title:"يشمل",text:"فريق + أدوات + نسخ احتياطية + تدريب"},{color:"orange",title:"الأهمية",text:"تحضير جيد = استجابة سريعة وأقل ضرر"}]},{id:78,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"المرحلة 2 - الاكتشاف",points:["اكتشاف وتأكيد وقوع حادث - هل هذا فعلاً حادث أمني أم مشكلة عادية؟","مصادر الاكتشاف: تنبيهات أنظمة المراقبة، بلاغ موظف، سلوك غير طبيعي","التأكيد: جمع أدلة أولية، تحديد ما حدث، متى، أين، ما الأنظمة المتأثرة","التوثيق من البداية: كل خطوة موثقة - مهم للتحليل والقانون","السرعة مهمة - كل دقيقة تأخير قد تزيد الضرر"],boxes:[{color:"yellow",title:"الهدف",text:"اكتشاف وتأكيد - هل فعلاً حادث؟"},{color:"blue",title:"كيف؟",text:"تنبيهات + بلاغات + سلوك غير طبيعي"},{color:"green",title:"مهم",text:"توثيق من البداية + سرعة"}]},{id:79,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"المرحلة 3 - الاحتواء",points:["تحديد نطاق التأثير بحيث لا ينتشر الضرر - أهم مرحلة بعد الاكتشاف","احتواء قصير المدى: عزل سريع - فصل الجهاز المصاب عن الشبكة، إيقاف حساب مخترق","احتواء طويل المدى: إجراءات مؤقتة تسمح باستمرار العمل مع منع الانتشار","لماذا قبل الاستئصال؟ يجب أولاً منع انتشار الضرر بعزل الجزء المتأثر وتقييد أثره","إذا بدأت الاستئصال قبل الاحتواء، قد ينتشر التهديد أثناء محاولة إزالته"],boxes:[{color:"orange",title:"الهدف",text:"منع انتشار الضرر - عزل المصاب"},{color:"blue",title:"قصير المدى",text:"فصل الجهاز عن الشبكة فوراً"},{color:"green",title:"لماذا قبل الاستئصال؟",text:"أولاً أوقف الانتشار، ثم أزل السبب"}]},{id:80,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"المرحلة 4 - الاستئصال",points:["إزالة التهديد ومسبباته بشكل كامل","أمثلة: حذف البرمجيات الخبيثة، إغلاق حسابات مخترقة، معالجة الثغرة التي استُغلت","التأكد من عدم وجود أبواب خلفية أو حسابات إضافية أنشأها المهاجم","قد يتطلب إعادة بناء أنظمة من الصفر إذا كان الاختراق عميق","التحقق أن التهديد أزيل فعلاً - فحص شامل"],boxes:[{color:"green",title:"الهدف",text:"إزالة التهديد ومسبباته تماماً"},{color:"blue",title:"يشمل",text:"حذف خبيث + سد ثغرة + إغلاق أبواب خلفية"},{color:"orange",title:"تحقق",text:"تأكد أن التهديد أزيل فعلاً"}]},{id:81,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"المرحلة 5 - الاستعادة",points:["إعادة الأنظمة والخدمات إلى حالة طبيعية آمنة","قد تشمل الاستعادة من نسخة احتياطية سليمة وموثوقة","التأكد أن النسخة الاحتياطية نفسها غير مصابة - فحصها قبل الاستعادة","إعادة تدريجية: خدمات أقل حساسية أولاً، ثم الأكثر حساسية مع مراقبة","مراقبة مكثفة بعد الاستعادة للتأكد أن التهديد لم يعد"],boxes:[{color:"blue",title:"الهدف",text:"إعادة الخدمات لحالة طبيعية آمنة"},{color:"green",title:"كيف؟",text:"من نسخة احتياطية سليمة بعد فحصها"},{color:"orange",title:"حذر",text:"استعادة تدريجية + مراقبة مكثفة"}]},{id:82,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"المرحلة 6 - الدروس المستفادة",points:["تحليل ما حدث: كيف دخل المهاجم؟ ما الثغرة؟ لماذا لم نكتشف مبكراً؟","توثيق الدروس: كتابة تقرير شامل - ما سار جيداً، ما يحتاج تحسين","تحسين الضوابط: سد الثغرة، تحديث الإجراءات، تدريب إضافي، أدوات جديدة","الهدف: تقليل احتمال التكرار وأثره مستقبلاً","مشاركة الدروس (دون تفاصيل حساسة) مع فرق أخرى لتعم الفائدة"],boxes:[{color:"purple",title:"تحليل",text:"كيف حدث؟ لماذا؟"},{color:"blue",title:"توثيق",text:"تقرير شامل - إيجابيات وسلبيات"},{color:"green",title:"تحسين",text:"سد ثغرات + تحديث إجراءات + تدريب"}]},{id:83,lesson:3,lessonLabel:"الدرس 2-3",type:"diagram",title:"مخطط التسلسل - المراحل الست مع ملاحظات",flow:["1️⃣ التحضير - قبل الحادث - إجراءات وفريق ونسخ احتياطية","⬇️","2️⃣ الاكتشاف - تنبيه أو بلاغ - تأكيد أنه حادث","⬇️","3️⃣ الاحتواء - عزل سريع لمنع الانتشار","⬇️","4️⃣ الاستئصال - إزالة التهديد والثغرة","⬇️","5️⃣ الاستعادة - إعادة الخدمات من نسخ سليمة","⬇️","6️⃣ الدروس المستفادة - تحليل وتوثيق وتحسين","\uD83D\uDD04 ملاحظة: قد تتداخل بعض الأنشطة أو تعود لمراحل سابقة حسب الحادث - ليس خطي دائماً"]},{id:84,lesson:3,lessonLabel:"الدرس 2-3",type:"qa",title:"لماذا الاحتواء قبل الاستئصال؟",question:"لماذا لا نبدأ بإزالة التهديد مباشرة بعد الاكتشاف؟",answer:"يجب أولاً منع انتشار الضرر بعزل الجزء المتأثر وتقييد أثره، ثم إزالة السبب. إذا بدأت الاستئصال قبل الاحتواء، قد ينتشر التهديد أثناء محاولة إزالته، أو ينشئ نسخ جديدة. الاحتواء يحد من الضرر أولاً.",boxes:[{color:"orange",title:"أولاً",text:"احتواء - أوقف الانتشار"},{color:"green",title:"ثانياً",text:"استئصال - أزل السبب"},{color:"blue",title:"لو عكسنا",text:"قد ينتشر أثناء الإزالة"}]},{id:85,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"تقييم المخاطر - المقدمة",points:["تقييم أثر كل خطر واحتمال وقوعه ثم تحديد المخاطر الأعلى أولوية","ليس كل المخاطر متساوية - بعضها تأثيره كبير واحتماله عالي، بعضها صغير ونادر","الموارد محدودة - يجب التركيز على الأهم أولاً","تقييم المخاطر يساعد على اتخاذ قرارات: ماذا نعالج أولاً؟ كم نستثمر؟"],boxes:[{color:"blue",title:"ما هو؟",text:"تقييم الأثر + الاحتمال = تحديد الأولويات"},{color:"orange",title:"لماذا؟",text:"موارد محدودة - ركز على الأهم"}]},{id:86,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"تعريف الخطر",points:["احتمال أن يقع حدث يسبب ضرراً مع مراعاة احتمال وقوعه وحجم أثره","الخطر ليس الحدث نفسه بل احتمال وقوعه وضرره","مثال: خطر تسرب بيانات العملاء - احتمال متوسط، تأثير كبير","تقييم الخطر يحتاج تقدير الاثنين معاً: التأثير والاحتمالية"],boxes:[{color:"blue",title:"الخطر",text:"احتمال حدث يسبب ضرراً"},{color:"orange",title:"يُقيم بـ",text:"التأثير + الاحتمالية معاً"}]},{id:87,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"معادلة درجة الخطر",points:["درجة الخطر = التأثير × الاحتمالية","معادلة بسيطة لكن قوية - تحدد الأولوية","تأثير كبير × احتمالية عالية = خطر عالي جداً - أولوية قصوى","تأثير صغير × احتمالية منخفضة = خطر منخفض - آخر الأولويات"],boxes:[{color:"orange",title:"المعادلة",text:"درجة الخطر = التأثير × الاحتمالية"},{color:"blue",title:"مثال عالي",text:"كبير × عالي = أولوية قصوى"},{color:"green",title:"مثال منخفض",text:"صغير × منخفض = آخر الأولويات"}],extraNote:"هذه المعادلة أساس مصفوفة تقييم المخاطر"},{id:88,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"التأثير - مقدار الضرر",points:["التأثير: مقدار الضرر إذا وقعت المخاطرة - حجم الضرر إذا وقع الحدث","قد يكون مالي، سمعة، قانوني، تشغيلي","مثال تأثير كبير: تسرب بيانات 100,000 عميل - غرامات + فقدان ثقة + دعاوى","مثال تأثير صغير: انقطاع موقع غير أساسي لساعة - إزعاج محدود"],boxes:[{color:"orange",title:"ما هو؟",text:"مقدار الضرر إذا وقع الحدث"},{color:"blue",title:"أنواع",text:"مالي + سمعة + قانوني + تشغيلي"},{color:"yellow",title:"كبير",text:"تسرب 100k عميل - غرامات ضخمة"}]},{id:89,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"الاحتمالية - مدى احتمالية الوقوع",points:["الاحتمالية: مدى احتمالية وقوع المخاطرة - هل هي شائعة أم نادرة؟","تعتمد على: وجود ثغرة، وجود مهاجمين، ضوابط حالية، تاريخ حوادث سابقة","مثال احتمالية عالية: نظام بدون تحديثات منذ سنتين + ثغرة معروفة منشورة","مثال احتمالية منخفضة: نظام محدث + مراقب + تدريب + لا تاريخ هجمات مماثلة"],boxes:[{color:"blue",title:"ما هي؟",text:"مدى احتمالية وقوع المخاطرة"},{color:"green",title:"تعتمد على",text:"ثغرات + مهاجمين + ضوابط + تاريخ"},{color:"orange",title:"عالية",text:"نظام قديم بدون تحديث + ثغرة معروفة"}]},{id:90,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"كيف نستخدم مصفوفة تقييم المخاطر؟",points:["مصفوفة 3×3 أو 5×5: محور التأثير (صغير/متوسط/كبير) × محور الاحتمالية (منخفض/متوسط/عالي)","كل خطر يوضع في خلية حسب تقييمه - لون أحمر = أولوية قصوى، أصفر = متوسطة، أخضر = منخفضة","تعد المخاطر ذات التأثير العالي والاحتمالية العالية من أعلى الأولويات","ترتيب الحالات الأخرى يعتمد على درجات المصفوفة والسياق والضوابط الموجودة"],boxes:[{color:"blue",title:"المصفوفة",text:"تأثير × احتمالية - 3×3 أو 5×5"},{color:"orange",title:"أعلى أولوية",text:"تأثير عالي + احتمالية عالية = أحمر"},{color:"green",title:"ترتيب الباقي",text:"حسب الدرجة والسياق والضوابط"}]},{id:91,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"تصنيف: تأثير كبير + احتمالية عالية = أولوية قصوى",points:["مثال: قاعدة بيانات عملاء بدون تشفير + وصول إنترنت مباشر + ثغرة SQL Injection معروفة","التأثير: تسرب بيانات حساسة - غرامات + سمعة + قانوني - كبير جداً","الاحتمالية: ثغرة معروفة ومنشورة + وصول مباشر - عالية جداً","النتيجة: أولوية قصوى - يجب معالجته فوراً، لا يؤجل"],boxes:[{color:"orange",title:"الخطر",text:"قاعدة بيانات بدون حماية + ثغرة معروفة"},{color:"blue",title:"التأثير",text:"كبير - تسرب حساس"},{color:"green",title:"الاحتمالية",text:"عالية - ثغرة منشورة"},{color:"orange",title:"الأولوية",text:"قصوى - عالج فوراً"}]},{id:92,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"تصنيف: تأثير صغير + احتمالية منخفضة = أولوية منخفضة",points:["مثال: انقطاع موقع تجريبي غير مهم يستخدمه 5 موظفين داخلياً فقط لساعة واحدة","التأثير: صغير - 5 موظفين + غير أساسي + ساعة واحدة","الاحتمالية: منخفضة - داخلي فقط + مراقب + نسخ احتياطية","النتيجة: أولوية منخفضة - آخر الأولويات، يعالج إذا بقي وقت وموارد"],boxes:[{color:"green",title:"الخطر",text:"انقطاع موقع تجريبي داخلي"},{color:"blue",title:"التأثير",text:"صغير - 5 موظفين"},{color:"yellow",title:"الاحتمالية",text:"منخفضة - داخلي ومراقب"},{color:"green",title:"الأولوية",text:"منخفضة - آخر القائمة"}]},{id:93,lesson:3,lessonLabel:"الدرس 2-3",type:"qa",title:"هل يمكن تحديد حجم المخاطرة بالتأثير وحده؟",question:"خطر تأثيره كبير جداً لكن احتماله 0.01% - هل هو أولوية قصوى؟",answer:"لا، خطأ. يحدد حجم المخاطرة معاً من التأثير والاحتمالية. تأثير كبير × احتمالية ضئيلة = خطر متوسط أو منخفض. والعكس: تأثير صغير × احتمالية عالية قد يكون متوسط. يجب حساب الاثنين معاً بالمعادلة.",boxes:[{color:"orange",title:"خطأ",text:"التأثير وحده لا يكفي"},{color:"blue",title:"الصحيح",text:"التأثير × الاحتمالية معاً"},{color:"green",title:"مثال",text:"كبير × ضئيل = متوسط"}]},{id:94,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"المرحلة الأخيرة - الدروس المستفادة بتفصيل",points:["ليست مجرد تقرير - هي فرصة لتحسين حقيقي","أسئلة: ماذا سار جيداً؟ ماذا لم يسر؟ ما الثغرة الجذرية؟ كيف نمنع التكرار؟","تحسينات: تقنية (سد ثغرة)، إجرائية (تحديث خطة)، بشرية (تدريب)، أدوات (مراقبة أفضل)","المؤسسات الناضجة تقضي وقتاً في هذه المرحلة أكثر من غيرها - تتعلم"],boxes:[{color:"purple",title:"ليست نهاية",text:"بداية تحسين مستمر"},{color:"blue",title:"أسئلة",text:"ماذا سار؟ ماذا لم يسر؟ لماذا؟"},{color:"green",title:"تحسين",text:"تقني + إجرائي + بشري + أدوات"}]},{id:95,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"مطابقة - كل نشاط والمرحلة المناسبة",boxes:[{color:"blue",title:"إنشاء إجراءات استجابة مسبقاً",text:"← التحضير"},{color:"yellow",title:"فصل حاسوب مصاب بالبرمجيات الخبيثة عن الشبكة",text:"← الاحتواء (منع انتشار الضرر)"},{color:"green",title:"إزالة إصابة البرمجيات الخبيثة",text:"← الاستئصال"},{color:"orange",title:"تحليل السبب واتخاذ تدابير لعدم التكرار",text:"← الدروس المستفادة"},{color:"purple",title:"استعادة من نسخة احتياطية سليمة",text:"← الاستعادة"}]},{id:96,lesson:3,lessonLabel:"الدرس 2-3",type:"scenario",title:"سيناريو: نظام سجلات طلاب تعرض لهجوم فدية",subtitle:"الوضع: ملفات مشفرة، الموظفون محظورون، رسالة تطلب فدية",points:["النوع: برمجية فدية Ransomware - تشفر الملفات وتطلب فدية لفكها","التأثير: كبير - سجلات طلاب حساسة + توقف عمل + سمعة","الاحتمالية: كانت عالية إذا لم تكن هناك نسخ احتياطية وتحديثات","سنطبق المراحل الست على هذا السيناريو في الشرائح القادمة"],boxes:[{color:"orange",title:"الحادث",text:"فدية - ملفات مشفرة"},{color:"blue",title:"التأثير",text:"كبير - سجلات حساسة"},{color:"yellow",title:"المطلوب",text:"تطبيق المراحل الست"}]},{id:97,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"المراحل في سيناريو الفدية (1-3)",flow:["1️⃣ التحضير (كان ينبغي): إعداد إجراءات ونسخ احتياطية مسبقاً، تدريب، فريق استجابة - لو كان موجود، الاستعادة أسهل","2️⃣ الاكتشاف (الآن): للتو تم اكتشاف تشفير الملفات - موظف يبلغ أن ملفاته لا تفتح ورسالة فدية","3️⃣ الاحتواء (فوراً): عزل النظام المصاب عن الشبكة لمنع انتشار الفدية لباقي الأجهزة والخوادم - فصل كابل الشبكة، تعطيل WiFi"]},{id:98,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"المراحل في سيناريو الفدية (4-6)",flow:["4️⃣ الاستئصال: حذف برمجية الفدية من الأجهزة المصابة، معالجة الثغرة التي دخلت منها (مرفق تصيد؟ ثغرة؟)، فحص كل الأجهزة","5️⃣ الاستعادة: استعادة من نسخة احتياطية سليمة وموثوقة إلى حالة آمنة - بعد التأكد أن النسخة غير مصابة","6️⃣ الدروس: تحليل السبب - كيف دخلت الفدية؟ هل الموظفون يحتاجون تدريب تصيد؟ هل النسخ الاحتياطية كافية؟ تحسين الضوابط وتوثيق الدروس"],boxes:[{color:"green",title:"الدرس",text:"التحضير الجيد (نسخ احتياطية) يجعل الاستعادة ممكنة بدون دفع فدية"}]},{id:99,lesson:3,lessonLabel:"الدرس 2-3",type:"qa",title:"لماذا إذا بدأت الاستعادة قبل إزالة التهديد تواجه صعوبة؟",question:"ماذا يحدث لو استعدت من نسخة احتياطية قبل حذف الفدية؟",answer:"تواجه صعوبة لأنه تبقى البرمجية الخبيثة أو الثغرة، وقد تشفر الملفات المستعادة مرة أخرى. قد يلزم الرجوع لمرحلة الاستئصال مرة أخرى. الترتيب مهم: احتواء → استئصال → ثم استعادة.",boxes:[{color:"orange",title:"خطأ",text:"استعادة قبل استئصال = قد تشفر مرة أخرى"},{color:"green",title:"صحيح",text:"احتواء → استئصال → استعادة"},{color:"blue",title:"قد يلزم",text:"الرجوع لمرحلة سابقة إذا فشلت"}]},{id:100,lesson:3,lessonLabel:"الدرس 2-3",type:"qa",title:"ما مثال ليس حادثاً أمنياً؟",question:"أي من التالي ليس حادثاً أمنياً؟",answer:"إجراء تحديث للبرنامج لإضافة ميزات جديدة ليس حادثاً أمنياً - هو نشاط تطوير طبيعي. أما: تشفير بفدية، تسرب معلومات العملاء، خدمة ويب غير متاحة بسبب هجوم DDoS - فهي حوادث أمنية لأنها تؤثر في سرية أو سلامة أو توافر بجدية.",boxes:[{color:"green",title:"ليس حادث",text:"تحديث لإضافة ميزات"},{color:"orange",title:"حادث",text:"فدية + تسرب + DDoS"},{color:"blue",title:"المعيار",text:"هل يؤثر في CIA أو يخالف سياسة؟"}]},{id:101,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"الوصف الأدق للتسلسل - مرونة المراحل",points:["التسلسل العام: التحضير → الاكتشاف → الاحتواء → الاستئصال → الاستعادة → الدروس","لكن: بعض الأنشطة قد تتداخل - مثلاً أثناء الاحتواء قد تبدأ بجمع أدلة للاستئصال","وقد تعود لمرحلة سابقة - إذا فشلت الاستعادة، تعود للاستئصال","التسلسل يساعد على الفهم والتنظيم، لكن الواقع أكثر مرونة حسب الحادث","المهم: لا تتخطى الاحتواء قبل الاستئصال، ولا الاستئصال قبل الاحتواء"],boxes:[{color:"blue",title:"التسلسل العام",text:"تحضير → اكتشاف → احتواء → استئصال → استعادة → دروس"},{color:"green",title:"المرونة",text:"قد تتداخل أو تعود لمرحلة سابقة"},{color:"orange",title:"القاعدة",text:"لا تستعد قبل أن تستأصل، ولا تستأصل قبل أن تحتوي"}]},{id:102,lesson:3,lessonLabel:"الدرس 2-3",type:"content",title:"إجابة السؤال الرئيسي - كيف نستجيب ونحدد الأولويات؟",points:["الحادث الأمني: يؤثر في سرية أو سلامة أو توافر بجدية أو يخالف سياسة أمنية","نموذج ست مراحل ينظم الاستجابة: تحضير، اكتشاف، احتواء، إزالة تهديد، استعادة، ثم دروس","هذا التسلسل يساعد الفهم لكن بعض الأنشطة قد تتداخل حسب الحادث","لتحديد الأولويات: نقدر درجة الخطر من التأثير × الاحتمالية، ثم نبدأ بالمخاطر الأعلى","الهدف: تقليل الضرر واحتمال التكرار عبر استجابة منظمة وأولويات واضحة"],boxes:[{color:"blue",title:"الحادث",text:"يؤثر في سرية/سلامة/توافر بجدية"},{color:"green",title:"الاستجابة",text:"6 مراحل منظمة مع مرونة"},{color:"orange",title:"الأولويات",text:"التأثير × الاحتمالية = ترتيب"}]},{id:103,lesson:3,lessonLabel:"الدرس 2-3",type:"summary",title:"خلاصة الدرس 2-3",points:["اتبع التسلسل العام للمراحل الست: تحضير، اكتشاف، احتواء، استئصال، استعادة، دروس مع إمكانية التداخل","حدد أولويات المخاطر بناء على التأثير × الاحتمالية - الأعلى تأثير واحتمالية أولاً","التحضير الجيد (نسخ احتياطية، فريق، تدريب) يجعل الاستجابة أسرع وأقل ضرراً","الاحتواء قبل الاستئصال، والاستئصال قبل الاستعادة - ترتيب مهم","الدروس المستفادة ليست نهاية بل بداية تحسين مستمر"],boxes:[{color:"blue",title:"التسلسل",text:"تحضير → اكتشاف → احتواء → استئصال → استعادة → دروس"},{color:"orange",title:"الأولوية",text:"التأثير × الاحتمالية"},{color:"gr
